app = "koder-sandbox"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "20s"
    timeout = "5s"
    path = "/health"
    method = "GET"

  [[http_service.ports]]
    port = 443
    handlers = ["tls"]
